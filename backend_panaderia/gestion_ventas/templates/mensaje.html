{# gestion_ventas/templates/gestion_ventas/templates/mensaje.html #}

<div id="custom-modal-overlay" class="modal-overlay" style="display: none;">
    <div id="custom-modal-card" class="modal-card">
        <div class="modal-header">
            <span id="modal-title">Mensaje</span>
        </div>
        <div class="modal-body">
            <div id="custom-modal-icon" class="modal-icon"></div>
            <div id="custom-modal-text" class="modal-text"></div>
        </div>
        <div class="modal-footer">
            <div id="single-button-container">
                <button id="btn-close" class="modal-button"></button>
            </div>
            <div id="confirm-buttons-container" style="display: none; gap: 20px;">
                <button id="btn-confirm" class="modal-button"></button>
                <button id="btn-cancel" class="modal-button"></button>
            </div>
        </div>
    </div>
</div>
