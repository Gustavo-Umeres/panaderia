<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en BD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .error-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 2rem;
            background-color: #121212;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        .error-content {
            text-align: center;
            color: #E0E0E0;
            font-family: 'Roboto Mono', monospace;
            max-width: 600px;
            opacity: 0;
            animation: fadeIn 1s 0.2s ease-out forwards;
        }

        .error-icon {
            font-size: 5rem;
            color: #F04A4A;
            text-shadow: 0 0 15px rgba(240, 74, 74, 0.5), 0 0 30px rgba(240, 74, 74, 0.3);
            margin-bottom: 1.5rem;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .error-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 4.5rem;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0 0 1rem 0;
            position: relative;
            text-transform: uppercase;
        }

        .error-title::before,
        .error-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .error-title::before {
            left: 2px;
            text-shadow: -1px 0 #FF00C1;
            clip-path: inset(50% 0 50% 0);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        .error-title::after {
            left: -2px;
            text-shadow: -1px 0 #00FFF9;
            clip-path: inset(50% 0 50% 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .error-button {
            display: inline-block;
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            color: #F04A4A;
            background-color: transparent;
            border: 2px solid #F04A4A;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }

        .error-button:hover {
            background-color: #F04A4A;
            color: #121212;
            box-shadow: 0 0 25px rgba(240, 74, 74, 0.5);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 15px rgba(240, 74, 74, 0.5);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 25px rgba(240, 74, 74, 0.8);
            }
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(12% 0 85% 0); }
            20% { clip-path: inset(51% 0 18% 0); }
            40% { clip-path: inset(18% 0 45% 0); }
            60% { clip-path: inset(80% 0 12% 0); }
            80% { clip-path: inset(45% 0 45% 0); }
            100% { clip-path: inset(90% 0 5% 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(78% 0 12% 0); }
            20% { clip-path: inset(2% 0 58% 0); }
            40% { clip-path: inset(88% 0 2% 0); }
            60% { clip-path: inset(38% 0 42% 0); }
            80% { clip-path: inset(5% 0 85% 0); }
            100% { clip-path: inset(68% 0 15% 0); }
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-content">
        <div class="error-icon">
            <i class="fas fa-database"></i>
        </div>

        <h2 class="error-title" data-text="ERROR EN BD">
            ERROR EN BD
        </h2>
        
        <a href="{% url 'gestion_ventas:login_view' %}" class="error-button">
            VOLVER AL INICIO
        </a>
    </div>
</div>

</body>
</html>
